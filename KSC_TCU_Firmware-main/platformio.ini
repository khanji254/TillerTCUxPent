; PlatformIO Project Configuration File for KSC TCU Firmware Unit Tests
;
; Single environment. To choose which test runs, edit src/main/main.c
; (uncomment ONE *_run() call), then click Upload.

[platformio]
default_envs = tcu_test
src_dir = src
platforms_dir = C:\pio-alt\platforms
packages_dir = C:\pio-alt\packages

[env:tcu_test]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 2MB
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder
